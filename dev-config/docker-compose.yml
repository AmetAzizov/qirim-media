services:
  client:
    build:
      context: ../client
      dockerfile: dockerfile
      args:
        # Берётся из dev-config/.env (см. .env.example)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Задайте NEXT_PUBLIC_API_URL в dev-config/.env}
    ports:
      - "3000:3000"
    depends_on:
      - server-cms
    env_file:
      - ../client/.env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    networks:
      - app-network

  server-cms:
    build:
      context: ../server-cms
      dockerfile: dockerfile
    ports:
      - "1337:1337"
    env_file:
      - ../server-cms/.env
    environment:
      - NODE_ENV=production
      - TZ=Europe/Kyiv
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
